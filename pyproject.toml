[project]
name = "tabtrader"
version = "0.1.0"
description = "TabPFN-3.5 on CPU vs classic ML for pricing Kalshi BTC 15-minute and hourly binary contracts"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "tabpfn==9.1.0",
    "torch>=2.5",
    "tabpfn-client",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5,<1.7",
    "lightgbm>=4.4",
    "xgboost>=2.1",
    "catboost>=1.2",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "jupyter",
    "nbconvert",
    "ipykernel",
]

[project.optional-dependencies]
export = ["clickhouse-driver>=0.2.9"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabtrader"]
